# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.261.0/schema/sveltia-cms.json
backend:
  name: github
  repo: seisyuku/brand-site-cms-poc
  branch: codex/sveltia-cms-poc

media_folder: public/assets
public_folder: /assets
output:
  omit_empty_optional_fields: true

collections:
  - name: posts
    label: Posts
    folder: src/content/blog
    create: true
    delete: false
    extension: md
    format: yaml-frontmatter
    slug:
      template: '{{fields.slug}}'
      editable: false
    fields:
      - { name: author, label: Author, widget: string, required: false }
      - { name: pubDatetime, label: Publish date, widget: datetime, type: date, default: '{{now}}' }
      - { name: modDatetime, label: Modified date, widget: datetime, type: date, required: false }
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text }
      - name: slug
        label: URL slug
        widget: string
        required: false
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use lowercase letters, digits and hyphens.']
        hint: For new posts, supply a unique slug for the URL and filename. Changing it on an existing post changes its URL.
      - { name: draft, label: Draft, widget: boolean, required: false }
      - { name: featured, label: Featured, widget: boolean, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: ogImage, label: Open Graph image, widget: image, required: false }
      - { name: canonicalURL, label: Canonical URL, widget: string, required: false }
      - { name: body, label: Body, widget: markdown, required: false }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About page
        file: src/pages/about.md
        fields:
          - { name: layout, widget: hidden, default: ../layouts/AboutLayout.astro }
          - { name: title, label: Title, widget: string }
          - { name: body, label: Body, widget: markdown, required: false }
